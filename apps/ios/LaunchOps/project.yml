name: LaunchOps
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LaunchOps:
    type: application
    platform: iOS
    sources:
      - Sources/LaunchOps
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.launchops
        INFOPLIST_FILE: Sources/LaunchOps/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

