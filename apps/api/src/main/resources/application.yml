spring:
  application:
    name: launchops-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/launchops}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

launchops:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

